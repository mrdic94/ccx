# Configuración del servidor tmux de ccx (requiere tmux >= 3.2).
# Usa un socket propio (tmux -L ccx), así que no afecta a ningún otro tmux tuyo.
# El comando de portapapeles (copy-command) lo fija bin/ccx según el sistema.

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:extkeys"
set -s extended-keys on
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000

# Ratón: clic para enfocar paneles y elegir sesiones, rueda para desplazarse.
# (Mantén Shift al arrastrar para usar la selección nativa de la terminal.)
set -g mouse on
set -s set-clipboard on

# Sin prefijo: Ctrl+B queda libre para Claude Code.
set -g prefix None
unbind C-b
bind -n M-s select-pane -t :.+
bind -n M-d detach-client

# Aspecto
set -g status off
set -g pane-border-status top
set -g pane-border-format " #{?#{@ccx_title},#{@ccx_title},} "
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour75"
set -g set-titles on
set -g set-titles-string "ccx"
